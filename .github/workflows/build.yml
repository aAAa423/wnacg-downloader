name: 'Build Windows EXE'

on:
  workflow_dispatch: # 允许你在 Actions 页面手动点击按钮触发编译
  push:
    branches:
      - fix/slider-captcha # 当你推送到这个分支时自动触发（可选）

jobs:
  build-windows:
    runs-on: windows-latest # 直接使用 Windows 环境编译，最稳妥
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm' # 缓存 pnpm 依赖，加快后续编译速度

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target' # 缓存 Rust 编译产物

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 这里没有配置 release 相关的参数，所以它只会构建并把产物上传为 Artifact
